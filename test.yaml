# One-row smoke-test experiments table.
#
# Replaces scripts/test_minimal.sh: a small Llama-3.2-3B run that exercises
# the full generate → verify → analyze pipeline in a few minutes on an L4
# or H100 pod. Use this on a fresh pod after setup_pod.sh + sync_to_pod.sh
# to validate the end-to-end flow:
#
#   python -m inference_verification.run_experiments test.yaml

defaults:
  temperature: 1.0
  top_k: 50
  top_p: 0.95
  seed: 42
  n_prompts: 100
  max_tokens: 100
  max_ctx_len: 512
  max_model_len: 2048
  gpu_memory_utilization: 0.85
  prompts_file: prompts.json
  sigmas: [0.01, 1.0]
  support_size: 100
  classify: false
  gls_threshold: -5.0
  logit_rank_threshold: 32

experiments:
  - name: smoke
    model: meta-llama/Llama-3.2-3B-Instruct
    notes: end-to-end smoke test, small model
