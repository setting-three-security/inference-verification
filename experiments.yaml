# Example experiments table — copy and edit for real sweeps.
#
# Run with:
#   python -m inference_verification.run_experiments experiments.yaml
#
# - Per-row config = `defaults` merged with the row's keys (row wins).
# - `name` must be unique within this file (used as the dir prefix and
#   .index.json key).
# - `notes` is free text, recorded in the generation manifest.
# - No Cartesian expansion: a row with `models: [...]` is an error. Write
#   multiple rows (or generate this file with a tiny script).

defaults:
  temperature: 1.0
  top_k: 50
  top_p: 0.95
  seed: 42
  n_prompts: 1000
  max_tokens: 500
  max_ctx_len: 512
  max_model_len: 8192
  gpu_memory_utilization: 0.85
  prompts_file: prompts.json
  sigmas: [0.01, 1.0]
  support_size: 500
  classify: true
  gls_threshold: -5.0
  logit_rank_threshold: 32

experiments:
  - name: llama-8b-baseline
    model: meta-llama/Llama-3.1-8B-Instruct
    notes: baseline 8B reference run

  - name: llama-3b-baseline
    model: meta-llama/Llama-3.2-3B-Instruct
    notes: baseline 3B for comparison

  - name: qwen-30b-baseline
    model: Qwen/Qwen3-30B-A3B
    notes: MoE comparison point

  - name: llama-8b-sigma-sweep
    model: meta-llama/Llama-3.1-8B-Instruct
    sigmas: [0.001, 0.01, 0.1, 1.0]
    notes: dense sigma sweep on 8B
