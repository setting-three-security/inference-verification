name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: setting-three-security/inference-verification-tee

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build (no push, with cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python (for pytest smoke)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest + requests
        run: pip install pytest requests

      - name: Smoke (FAUX_MODE)
        run: |
          set -euo pipefail
          docker run -d --name ivt-smoke -e FAUX_MODE=1 -p 8000:8080 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}

          # Wait up to 30s for /health to return 200.
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "health responsive after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "smoke failed: /health never responded" >&2
              docker logs ivt-smoke || true
              docker rm -f ivt-smoke || true
              exit 1
            fi
            sleep 1
          done

          # Reuse the contract assertions in tests/test_tee_external.py. The non-slow
          # subset (TestHealth) hits /health and /config — exactly what we want for
          # a FAUX_MODE smoke. No new contract code needed.
          pytest tests/test_tee_external.py -m "not slow" --url http://localhost:8000

          docker rm -f ivt-smoke

      - name: Push to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha

      - name: Output digest
        run: echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}@${{ steps.push.outputs.digest }}"
