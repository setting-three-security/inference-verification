name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: setting-three-security/inference-verification-tee

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build (no push, with cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Capture the image config sha256 of what we're about to smoke, so we can
      # verify after push that BuildKit's second pass produced the same bytes.
      - name: Capture smoked image ID
        id: smoked
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}"
          SMOKED_ID=$(docker inspect --format='{{.Id}}' "$IMAGE")
          echo "id=$SMOKED_ID" >> "$GITHUB_OUTPUT"
          echo "smoked image id: $SMOKED_ID"

      - name: Set up Python (for pytest smoke)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest + requests
        run: pip install pytest requests

      - name: Smoke (FAUX_MODE)
        run: |
          set -euo pipefail

          # On any non-zero exit (health-poll timeout, pytest failure, etc.),
          # dump container logs to help diagnose. Always remove the container.
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "--- docker logs ivt-smoke ---"
              docker logs ivt-smoke || true
            fi
            docker rm -f ivt-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name ivt-smoke -e FAUX_MODE=1 -p 8000:8080 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}

          # Wait up to 30s for /health to return 200.
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "health responsive after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "smoke failed: /health never responded" >&2
              exit 1
            fi
            sleep 1
          done

          # Reuse the contract assertions in tests/test_tee_external.py. The non-slow
          # subset (TestHealth) hits /health and /config — exactly what we want for
          # a FAUX_MODE smoke. No new contract code needed.
          pytest tests/test_tee_external.py -m "not slow" --url http://localhost:8000

      - name: Push to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha

      # Gate: BuildKit's cache-aware push is ~4x faster than `docker push`, but
      # only because it doesn't materialize the image locally first. If layer
      # cache eviction or base-image drift caused the second build to produce
      # different bytes, the pushed image would diverge from the smoked one
      # silently. This step fails the workflow if that happens, restoring the
      # smoke gate's bit-for-bit guarantee without giving up BuildKit's speed.
      - name: Verify pushed image matches smoked image
        run: |
          set -euo pipefail
          SMOKED_ID="${{ steps.smoked.outputs.id }}"
          PUSHED_ID="${{ steps.push.outputs.imageid }}"
          if [ -z "$PUSHED_ID" ]; then
            echo "ERROR: docker/build-push-action did not expose imageid" >&2
            exit 1
          fi
          if [ "$PUSHED_ID" != "$SMOKED_ID" ]; then
            echo "ERROR: pushed image differs from smoked image" >&2
            echo "  smoked: $SMOKED_ID" >&2
            echo "  pushed: $PUSHED_ID" >&2
            exit 1
          fi
          echo "OK: smoked == pushed ($SMOKED_ID)"

      - name: Output digest
        run: echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}@${{ steps.push.outputs.digest }}"
